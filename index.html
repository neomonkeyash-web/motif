  input[type=range] { width: 100%; }

<body>
<div id="root"></div>
<script>
"use strict";

var SIZE = 900;   // 書き出し（高解像度）
var N = 24;

var PALETTE = [
  "#000000","#808080","#800000","#808000","#008000","#008080","#000080","#800080",
  "#FFFFFF","#C0C0C0","#FF0000","#FFFF00","#00FF00","#00FFFF","#0000FF","#FF00FF"
];

// ラインストーンの色（透明な宝石として描く）
var GEMS = [
  { id:"crystal", name:"クリスタル", hue:"#E6EEF8" }, { id:"pink",   name:"ピンク",     hue:"#FF6FAE" },
  { id:"red",     name:"レッド",     hue:"#E01F2D" }, { id:"orange", name:"オレンジ",   hue:"#FF8A1E" },
  { id:"yellow",  name:"イエロー",   hue:"#F5D400" }, { id:"lime",   name:"ライム",     hue:"#8ED11B" },
  { id:"green",   name:"グリーン",   hue:"#12A45C" }, { id:"teal",   name:"ティール",   hue:"#00BFC6" },
  { id:"aqua",    name:"アクア",     hue:"#3AA8F0" }, { id:"blue",   name:"ブルー",     hue:"#1E3ED6" },
  { id:"violet",  name:"バイオレット",hue:"#8B4FD1" }, { id:"purple", name:"パープル",   hue:"#C63BC0" }
];
var GEM_CUTS = ["hex6","poly14","round","heart","star","square","oval","flower","teardrop"];
// 多角形カットの辺の数
var CUT_SIDES = { hex6:6, poly14:14, round:16, oval:16, square:4 };

/* ============================================================
   実写のラインストーン画像をここに並べる。
   透過PNGを ./gems/ に置いて、下の list に足せば使えるようになる。
   画像がない・読み込めないときは、描画のラインストーンで表示される。
   例）{ id:"photo1", name:"ピンク丸", src:"gems/pink-round.png" }
   ============================================================ */
var GEM_PHOTOS = {
  base: "gems/",
  list: [
    // ここに実写素材を追加していく（今は空なので描画版が使われる）
    // { id:"p-pink",   name:"ピンク（実写）",     src:"pink-round.png" },
    // { id:"p-crystal",name:"クリスタル（実写）", src:"crystal-round.png" },
    // { id:"p-blue",   name:"ブルー（実写）",     src:"blue-round.png" },
    // { id:"p-heart",  name:"ハート（実写）",     src:"pink-heart.png" }
  ]
};
var gemImgCache = {};
function gemPhotoImage(item) {
  var key = item.id;
  if (!gemImgCache[key]) {
    var im = new Image();
    im.onload = function(){ paintBoard(); };
    im.onerror = function(){ im._failed = true; };
    im.src = GEM_PHOTOS.base + item.src;
    gemImgCache[key] = im;
  }
  return gemImgCache[key];
}
function findPhoto(id) {
  for (var i=0;i<GEM_PHOTOS.list.length;i++) if (GEM_PHOTOS.list[i].id===id) return GEM_PHOTOS.list[i];
  return null;
}

var SHAPES = ["circle","square","triangle","cross","diamond","star","heart","flower","butterfly",
              "sparkle","spark4","spark6","sparkCross","sparkBlur"];
var PATTERNS = ["dot","stripe","border","check","grid"];
var SHAPE_LABEL = { circle:"まる", square:"しかく", triangle:"さんかく", cross:"バツ", diamond:"ひしがた",
  star:"ほし", heart:"ハート", flower:"はな", butterfly:"ちょう",
  sparkle:"きらめき", spark4:"ひかり 4方向", spark6:"ひかり 6方向",
  sparkCross:"ひかり 十字", sparkBlur:"ひかり にじみ" };
var SPARK_LABEL = ["4方向のひかり","6方向のひかり","十字＋クロス","まるいにじみ"];
var CUT_LABEL = { hex6:"六角（6面）", poly14:"十四角（14面）", round:"ラウンド", heart:"ハート",
  star:"スター", square:"スクエア", oval:"オーバル", flower:"フラワー", teardrop:"ドロップ" };
var PATTERN_LABEL = { dot:"水玉", stripe:"縦縞", border:"横縞", check:"チェック", grid:"格子" };

var state = {
  items: [],
  mode: "gem",           // gem | stamp | brush | fill | text | erase
  color: "#FF0000",
  shape: "circle",
  size: 4,
  brushW: 6,
  gem: "pink",
  gemPhoto: null,        // 実写素材を使うときの id
  cut: "hex6",
  gemSize: 26,
  gemGap: 88,
  spark: 0,              // 煌めきの形（0〜3）
  sparkSize: 100,        // 光の大きさ（％）
  outline: false,        // 図形を線だけで描く
  lineW: 8,              // 線の太さ
  alpha: 100,            // ペンの濃さ（％）
  customPal: null,       // 自分の配色
  bgType: "none",        // none | color | pattern
  bgColor: "#FFFFFF",
  layers: [
    { type:"dot", color:"#FF00FF", count:16, thick:50, offset:0, angle:0, alpha:100, stagger:false, on:true }
  ],
  layerIdx: 0,
  text: "",
  labelOn: true,
  labelBg: "#FFFF00",
  textColor: "#000000",
  drawing: false, cur: null, lastGem: null, history: []
};

/* ================= 形 ================= */
function pathShape(ctx, shape, cx, cy, r) {
  ctx.beginPath();
  function poly(pts) {
    pts.forEach(function (p, i) {
      var x = cx + p[0] * r, y = cy + p[1] * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
  }
  switch (shape) {
    case "square": ctx.rect(cx - r, cy - r, r * 2, r * 2); break;
    case "triangle": poly([[0,-1],[0.92,0.72],[-0.92,0.72]]); break;
    case "diamond": poly([[0,-1],[1,0],[0,1],[-1,0]]); break;
    case "cross": { var t=0.3; poly([[-t,-1],[t,-1],[t,-t],[1,-t],[1,t],[t,t],[t,1],[-t,1],[-t,t],[-1,t],[-1,-t],[-t,-t]]); break; }
    case "star": { var p1=[]; for(var i=0;i<10;i++){var a=(Math.PI/5)*i-Math.PI/2;var rr=(i%2===0)?1:0.42;p1.push([Math.cos(a)*rr,Math.sin(a)*rr]);} poly(p1); break; }
    case "sparkle": { var s=0.14; poly([[0,-1],[s,-s],[1,0],[s,s],[0,1],[-s,s],[-1,0],[-s,-s]]); break; }
    case "heart":
      ctx.moveTo(cx, cy + r*0.78);
      ctx.bezierCurveTo(cx-r*1.5, cy-r*0.25, cx-r*0.5, cy-r*1.15, cx, cy-r*0.4);
      ctx.bezierCurveTo(cx+r*0.5, cy-r*1.15, cx+r*1.5, cy-r*0.25, cx, cy+r*0.78);
      ctx.closePath(); break;

    case "butterfly":
      poly([[0,-0.72],[0.44,-0.94],[0.90,-0.54],[0.84,-0.04],[0.30,-0.04],[0.84,0.30],[0.84,0.80],
            [0.40,0.94],[0,0.34],[-0.40,0.94],[-0.84,0.80],[-0.84,0.30],[-0.30,-0.04],[-0.84,-0.04],
            [-0.90,-0.54],[-0.44,-0.94]]);
      break;
    case "spark4": {
      var q=0.13;
      poly([[0,-1],[q,-q],[1,0],[q,q],[0,1],[-q,q],[-1,0],[-q,-q]]);
      break;
    }
    case "spark6": {
      var p6=[];
      for(var m6=0;m6<12;m6++){ var a6=(Math.PI/6)*m6-Math.PI/2; var r6=(m6%2===0)?1:0.17;
        p6.push([Math.cos(a6)*r6, Math.sin(a6)*r6]); }
      poly(p6); break;
    }
    case "sparkCross": {
      var t2=0.09, d2=0.42, t3=0.05;
      poly([[-t2,-1],[t2,-1],[t2,-t2],[1,-t2],[1,t2],[t2,t2],[t2,1],[-t2,1],[-t2,t2],[-1,t2],[-1,-t2],[-t2,-t2]]);
      // 斜めの細い光
      [[1,1],[1,-1]].forEach(function(dg){
        ctx.moveTo(cx-d2*dg[0]*r-t3*r, cy-d2*dg[1]*r);
        ctx.lineTo(cx+d2*dg[0]*r-t3*r, cy+d2*dg[1]*r);
        ctx.lineTo(cx+d2*dg[0]*r+t3*r, cy+d2*dg[1]*r);
        ctx.lineTo(cx-d2*dg[0]*r+t3*r, cy-d2*dg[1]*r);
        ctx.closePath();
      });
      break;
    }
    case "sparkBlur": {
      // 中心が濃い光のにじみ（6枚の細い花びら）
      for(var b6=0;b6<6;b6++){
        var ab=(Math.PI/3)*b6;
        ctx.moveTo(cx,cy);
        ctx.quadraticCurveTo(cx+Math.cos(ab-0.24)*r*0.7, cy+Math.sin(ab-0.24)*r*0.7,
                             cx+Math.cos(ab)*r, cy+Math.sin(ab)*r);
        ctx.quadraticCurveTo(cx+Math.cos(ab+0.24)*r*0.7, cy+Math.sin(ab+0.24)*r*0.7, cx, cy);
        ctx.closePath();
      }
      ctx.moveTo(cx+r*0.2,cy); ctx.arc(cx,cy,r*0.2,0,Math.PI*2);
      break;
    }
    case "flower": {
      for (var k = 0; k < 6; k++) {
        var ang = (Math.PI/3)*k - Math.PI/2;
        var px = cx + Math.cos(ang)*r*0.58, py = cy + Math.sin(ang)*r*0.58;
        ctx.moveTo(px + r*0.42, py);
        ctx.arc(px, py, r*0.42, 0, Math.PI*2);
      }
      ctx.moveTo(cx + r*0.3, cy); ctx.arc(cx, cy, r*0.3, 0, Math.PI*2);
      break;
    }
    default: ctx.arc(cx, cy, r, 0, Math.PI*2);
  }
}
function drawShape(ctx, shape, cx, cy, r, color, outline, lw) {
  pathShape(ctx, shape, cx, cy, r);
  if (outline) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.8, (lw || 8) / 100 * r);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.stroke();
  } else {
    ctx.fillStyle = color;
    ctx.fill();
  }
}

/* ================= ラインストーン ================= */
function hexToRgb(h) {
  return { r: parseInt(h.substr(1,2),16), g: parseInt(h.substr(3,2),16), b: parseInt(h.substr(5,2),16) };
}
function shade(hex, k) {
  var c = hexToRgb(hex);
  function f(v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1+k) : v + (255-v)*k))); }
  return "rgb(" + f(c.r) + "," + f(c.g) + "," + f(c.b) + ")";
}
function pathCut(ctx, cut, cx, cy, r, rot) {
  ctx.beginPath();
  if (cut === "hex6" || cut === "poly14") {
    var sides = CUT_SIDES[cut];
    var off = (rot||0) - Math.PI/2;
    for (var pi=0; pi<sides; pi++) {
      var pa = off + (Math.PI*2/sides)*pi;
      var px = cx + Math.cos(pa)*r, py = cy + Math.sin(pa)*r;
      if (pi===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    return;
  }
  if (cut === "heart") pathShape(ctx, "heart", cx, cy, r);
  else if (cut === "star") pathShape(ctx, "star", cx, cy, r);
  else if (cut === "flower") pathShape(ctx, "flower", cx, cy, r);
  else if (cut === "square") { ctx.rect(cx-r*0.82, cy-r*0.82, r*1.64, r*1.64); }
  else if (cut === "oval") { ctx.save(); ctx.translate(cx,cy); ctx.scale(0.72,1); ctx.arc(0,0,r,0,Math.PI*2); ctx.restore(); }
  else if (cut === "teardrop") {
    ctx.moveTo(cx, cy - r);
    ctx.bezierCurveTo(cx + r*0.95, cy - r*0.1, cx + r*0.72, cy + r, cx, cy + r);
    ctx.bezierCurveTo(cx - r*0.72, cy + r, cx - r*0.95, cy - r*0.1, cx, cy - r);
    ctx.closePath();
  }
  else ctx.arc(cx, cy, r, 0, Math.PI*2);
}
// 煌めきの形（4種）
function drawSparkle(ctx, kind, x, y, L, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#FFFFFF";
  if (kind === 0) {
    // 4方向のとがった光
    ctx.beginPath();
    ctx.moveTo(x, y-L); ctx.quadraticCurveTo(x+L*0.13,y-L*0.13, x+L,y);
    ctx.quadraticCurveTo(x+L*0.13,y+L*0.13, x,y+L);
    ctx.quadraticCurveTo(x-L*0.13,y+L*0.13, x-L,y);
    ctx.quadraticCurveTo(x-L*0.13,y-L*0.13, x,y-L);
    ctx.fill();
  } else if (kind === 1) {
    // 6方向
    ctx.beginPath();
    for (var i=0;i<12;i++){
      var a=(Math.PI/6)*i-Math.PI/2, rr=(i%2===0)?L:L*0.16;
      var px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 2) {
    // 十字＋斜めの細い光
    ctx.strokeStyle="#FFFFFF"; ctx.lineCap="round";
    ctx.lineWidth=Math.max(0.6,L*0.16);
    ctx.beginPath();
    ctx.moveTo(x-L,y); ctx.lineTo(x+L,y);
    ctx.moveTo(x,y-L); ctx.lineTo(x,y+L);
    ctx.stroke();
    ctx.lineWidth=Math.max(0.4,L*0.09);
    ctx.beginPath();
    var d=L*0.52;
    ctx.moveTo(x-d,y-d); ctx.lineTo(x+d,y+d);
    ctx.moveTo(x+d,y-d); ctx.lineTo(x-d,y+d);
    ctx.stroke();
  } else {
    // まるい光のにじみ
    var g=ctx.createRadialGradient(x,y,0,x,y,L);
    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(0.35,"rgba(255,255,255,0.55)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,L,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// 宝石をひとつ描く
// ① 多角形のベース ② 中心へ向かう対角線でカット面を分割
// ③ 放射状グラデーション（中央が明るい） ④ 白い十字の光を縁に重ねる
function drawGem(ctx, cut, hue, cx, cy, r, sparkKind, rot, seedN) {
  rot = rot || 0;
  if (cut === "hex" || cut === "poly14") rot = rot % (Math.PI*2);
  var rnd = mulberry((seedN||1)*7919);
  var sides = CUT_SIDES[cut] || 16;
  var isPoly = (cut === "hex6" || cut === "poly14");
  var tableR = r * (isPoly ? 0.42 : 0.50);

  // --- 落ち影 ---
  ctx.save();
  ctx.globalAlpha = 0.24;
  ctx.fillStyle = "#000";
  pathCut(ctx, cut, cx + r*0.07, cy + r*0.12, r*1.03, rot);
  ctx.fill();
  ctx.restore();

  // --- 銀の座金 ---
  ctx.save();
  pathCut(ctx, cut, cx, cy, r*1.05, rot);
  var fg = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
  fg.addColorStop(0,"#FEFEFE"); fg.addColorStop(0.45,"#C8C8D2"); fg.addColorStop(1,"#F2F2F6");
  ctx.fillStyle = fg; ctx.fill();
  ctx.restore();

  ctx.save();
  pathCut(ctx, cut, cx, cy, r, rot);
  ctx.clip();

  // --- ③ 放射状グラデーション（中央が明るい／外が濃い） ---
  var g = ctx.createRadialGradient(cx-r*0.20, cy-r*0.24, r*0.03, cx, cy, r*1.12);
  g.addColorStop(0,   "#FFFFFF");
  g.addColorStop(0.20, shade(hue, 0.62));
  g.addColorStop(0.55, hue);
  g.addColorStop(1,   shade(hue, -0.48));
  ctx.fillStyle = g;
  ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);

  // --- ② 中心に向かう対角線でカット面をつくる ---
  var off = rot - Math.PI/2;
  for (var i = 0; i < sides; i++) {
    var a0 = off + (Math.PI*2/sides)*i;
    var a1 = a0 + (Math.PI*2/sides);
    var am = (a0 + a1) / 2;
    // 多角形は頂点まで、丸は少し外まで
    var rr = isPoly ? r : r*1.06;
    var ox0 = cx + Math.cos(a0)*rr, oy0 = cy + Math.sin(a0)*rr;
    var ox1 = cx + Math.cos(a1)*rr, oy1 = cy + Math.sin(a1)*rr;
    var ix0 = cx + Math.cos(a0)*tableR, iy0 = cy + Math.sin(a0)*tableR;
    var ix1 = cx + Math.cos(a1)*tableR, iy1 = cy + Math.sin(a1)*tableR;

    ctx.beginPath();
    ctx.moveTo(ox0,oy0); ctx.lineTo(ox1,oy1); ctx.lineTo(ix1,iy1); ctx.lineTo(ix0,iy0);
    ctx.closePath();

    // 光源は左上。面の向きで明暗を決める
    var lit = Math.cos(am - (-2.3));
    var k = 0.50 * lit + (rnd()-0.5)*0.12;
    var fgr = ctx.createLinearGradient(ix0, iy0, ox0, oy0);
    fgr.addColorStop(0, shade(hue, k*0.55 + 0.20));
    fgr.addColorStop(1, shade(hue, k - 0.22));
    ctx.fillStyle = fgr;
    ctx.fill();
    // カット線
    ctx.strokeStyle = "rgba(255,255,255," + (0.18 + Math.max(0,lit)*0.42).toFixed(2) + ")";
    ctx.lineWidth = Math.max(0.35, r*0.026);
    ctx.stroke();
  }

  // --- ちりめんじわ（覆い焼き） ---
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  var tr = mulberry((seedN||5)*15485863);
  var grains = Math.max(20, Math.floor(r*r*0.14));
  for (var t2=0;t2<grains;t2++){
    var ta = tr()*Math.PI*2, td = Math.sqrt(tr())*r;
    ctx.globalAlpha = 0.08+tr()*0.26;
    ctx.fillStyle = tr()<0.7 ? "#FFFFFF" : shade(hue,0.6);
    ctx.beginPath(); ctx.arc(cx+Math.cos(ta)*td, cy+Math.sin(ta)*td, r*(0.012+tr()*0.045), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // --- プリズム（光の波長分解） ---
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.32;
  var pr = rot + rnd()*Math.PI*2;
  var pg = ctx.createLinearGradient(
    cx + Math.cos(pr)*r, cy + Math.sin(pr)*r,
    cx - Math.cos(pr)*r, cy - Math.sin(pr)*r);
  pg.addColorStop(0.00,"rgba(255,90,170,0)");
  pg.addColorStop(0.16,"rgba(255,110,180,0.85)");
  pg.addColorStop(0.34,"rgba(255,235,120,0.85)");
  pg.addColorStop(0.52,"rgba(255,255,255,0.9)");
  pg.addColorStop(0.70,"rgba(120,235,255,0.85)");
  pg.addColorStop(0.86,"rgba(170,140,255,0.8)");
  pg.addColorStop(1.00,"rgba(120,235,255,0)");
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(cx + r*0.06, cy + r*0.22, r*0.92, r*0.42, pr*0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // --- テーブル面（中央の平らな面。多角形と同じ辺の数で） ---
  ctx.beginPath();
  for (var j = 0; j < sides; j++) {
    var aa = off + (Math.PI*2/sides)*j;
    var px = cx + Math.cos(aa)*tableR, py = cy + Math.sin(aa)*tableR;
    if (j === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  var tg = ctx.createRadialGradient(cx-tableR*0.3, cy-tableR*0.34, 0, cx, cy, tableR*1.3);
  tg.addColorStop(0, "#FFFFFF");
  tg.addColorStop(0.4, shade(hue, 0.45));
  tg.addColorStop(1, shade(hue, -0.08));
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = Math.max(0.4, r*0.032);
  ctx.stroke();

  // --- 縁の締まり（オーバーレイ） ---
  ctx.save();
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.42;
  var og = ctx.createRadialGradient(cx-r*0.2, cy-r*0.24, r*0.1, cx, cy, r*1.05);
  og.addColorStop(0, "rgba(255,255,255,0.5)");
  og.addColorStop(0.55, "rgba(128,128,128,0)");
  og.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = og;
  ctx.fillRect(cx-r*1.2, cy-r*1.2, r*2.4, r*2.4);
  ctx.restore();

  ctx.restore();

  // --- ふち ---
  ctx.save();
  pathCut(ctx, cut, cx, cy, r, rot);
  ctx.lineWidth = Math.max(0.5, r*0.05);
  ctx.strokeStyle = "rgba(255,255,255,0.62)"; ctx.stroke();
  ctx.lineWidth = Math.max(0.4, r*0.028);
  ctx.strokeStyle = "rgba(0,0,0,0.20)"; ctx.stroke();
  ctx.restore();

  // --- ④ 白い十字の光を縁に重ねる（加算合成） ---
  var sk = (typeof sparkKind === "number") ? sparkKind : state.spark;
  var cols = sparkPalette(hue);
  var scale = (state.sparkSize || 100) / 100;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  // 縁の上のいちばん明るい点に、大きな十字光
  var ea = off + (Math.PI*2/sides) * Math.floor(sides*0.62);
  var ex = cx + Math.cos(-2.3)*r*0.72, ey = cy + Math.sin(-2.3)*r*0.72;
  var el = r*0.95*scale;
  var eg2 = ctx.createRadialGradient(ex,ey,0,ex,ey,el);
  eg2.addColorStop(0,"rgba(255,255,255,0.9)");
  eg2.addColorStop(1,"rgba(255,255,255,0)");
  ctx.globalAlpha = 0.8; ctx.fillStyle = eg2;
  ctx.beginPath(); ctx.arc(ex,ey,el,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  drawParticle(ctx, kindOf(sk), ex, ey, r*0.72*scale, rot*0.4, "#FFFFFF", 0.95);

  // 中央にも小さめの光
  drawParticle(ctx, kindOf(sk), cx, cy, r*0.34*scale, rot*0.8, "#FFFFFF", 0.55);

  // 散らばる光
  if (r > 5) {
    var rn = mulberry((seedN||3)*104729);
    var n = 2 + Math.floor(rn()*4);
    for (var q=0;q<n;q++){
      var qa = rn()*Math.PI*2;
      var qd = r*(0.35 + rn()*0.72);
      var qr = r*(0.07 + rn()*0.22)*scale;
      var qc = cols[Math.floor(rn()*cols.length)];
      drawParticle(ctx, (rn()<0.5?0:kindOf(sk)),
        cx+Math.cos(qa)*qd, cy+Math.sin(qa)*qd, qr, rn()*Math.PI*2, qc, 0.4+rn()*0.5);
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

// 煌めきの種類（0〜3）をパーティクルの形に対応させる
function kindOf(sk) {
  return (sk===0) ? 1 : (sk===1) ? 4 : (sk===2) ? 1 : 0;
}

/* ================= グリッターペン ================= */
// 線に沿って、光る粒をびっしり撒く
// 色つきの煌めきを1つ描く
function drawSparkleColor(ctx, kind, x, y, L, alpha, col) {
  drawParticle(ctx, (kind===0?1:(kind===1?4:(kind===2?1:0))), x, y, L, 0, col || "#FFFFFF", alpha);
}

// 色が白/グレーのときは虹色、それ以外は白系の光を返す
function sparkPalette(color) {
  var c = hexToRgb(color);
  var mx = Math.max(c.r,c.g,c.b), mn = Math.min(c.r,c.g,c.b);
  var isGray = (mx - mn) < 28;      // 彩度がほぼない＝白・グレー・黒
  if (isGray) {
    return ["#FF5FA2","#FFB13D","#FFF25E","#7DF07D","#5EC8FF","#8B7BFF","#E96BFF"]; // レインボー
  }
  return ["#FFFFFF","#FFFFFF","#FFF7D6","#EAF4FF","#FFEAF6"];                        // 白系
}

// パーティクルを1つ描く（形・回転・大きさはランダム）
function drawParticle(ctx, kind, x, y, r, rot, col, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  if (kind === 0) {                      // 光のドット
    ctx.arc(0, 0, r, 0, Math.PI*2);
  } else if (kind === 1) {               // 4方向の星
    var q = r*0.16;
    ctx.moveTo(0,-r); ctx.quadraticCurveTo(q,-q, r,0);
    ctx.quadraticCurveTo(q,q, 0,r);
    ctx.quadraticCurveTo(-q,q, -r,0);
    ctx.quadraticCurveTo(-q,-q, 0,-r);
  } else if (kind === 2) {               // 5角の星
    for (var i=0;i<10;i++){
      var a=(Math.PI/5)*i-Math.PI/2, rr=(i%2===0)?r:r*0.44;
      var px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
  } else if (kind === 3) {               // ダイヤ
    ctx.moveTo(0,-r); ctx.lineTo(r*0.62,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.62,0);
    ctx.closePath();
  } else {                               // 6方向のきらめき
    for (var j=0;j<12;j++){
      var b=(Math.PI/6)*j, rb=(j%2===0)?r:r*0.15;
      var qx=Math.cos(b)*rb, qy=Math.sin(b)*rb;
      if(j===0)ctx.moveTo(qx,qy);else ctx.lineTo(qx,qy);
    }
    ctx.closePath();
  }
  ctx.fill();
  ctx.restore();
}

// なぞった軌跡に沿って、等間隔でパーティクルを撒く
function drawGlitterStroke(ctx, pts, size, w, color, seed, alpha) {
  if (!pts.length) return;
  var width = Math.max(3, (w/100)*size);
  var rnd = mulberry(seed || 1);
  var cols = sparkPalette(color);
  var a = (alpha === undefined ? 1 : alpha);

  // --- 1. 軌跡を等間隔の点に直す（直線補間） ---
  var pitch = Math.max(1.2, width*0.16);   // 撒く間隔
  var path = [];
  if (pts.length === 1) {
    path.push([pts[0][0]*size, pts[0][1]*size]);
  } else {
    for (var s2=0; s2<pts.length-1; s2++) {
      var x0=pts[s2][0]*size,   y0=pts[s2][1]*size;
      var x1=pts[s2+1][0]*size, y1=pts[s2+1][1]*size;
      var dist = Math.hypot(x1-x0, y1-y0);
      var n = Math.max(1, Math.round(dist/pitch));
      for (var k=0;k<n;k++){
        var t = k/n;
        path.push([x0+(x1-x0)*t, y0+(y1-y0)*t]);
      }
    }
    path.push([pts[pts.length-1][0]*size, pts[pts.length-1][1]*size]);
  }

  // --- 2. 帯を3層で描く（白のふち → 本体 → 明るい芯） ---
  function strokePath(lw, style, alp, comp) {
    ctx.save();
    ctx.globalAlpha = alp;
    ctx.globalCompositeOperation = comp || "source-over";
    ctx.strokeStyle = style;
    ctx.lineWidth = lw;
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath();
    path.forEach(function(p,i){ if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
    if (path.length===1) ctx.lineTo(path[0][0]+0.1, path[0][1]);
    ctx.stroke();
    ctx.restore();
  }
  // 白いふち（外側にひとまわり大きく）— これで発光して見える
  strokePath(width*1.14, "#FFFFFF", a*0.55);
  // 本体
  strokePath(width*0.82, color, a*0.9);
  // 明るい芯
  strokePath(width*0.34, shade(color, 0.55), a*0.6);

  // --- 3. 光のパーティクル（加算合成で、重なるほど白く光る） ---
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  path.forEach(function(p){
    var many = 2 + Math.floor(rnd()*3);
    for (var m=0;m<many;m++){
      var ang = rnd()*Math.PI*2;
      var far = rnd() < 0.20;                        // ときどき外まで飛び散る
      var off = rnd()*width*(far ? 1.35 : 0.52);
      var px = p[0]+Math.cos(ang)*off;
      var py = p[1]+Math.sin(ang)*off;
      var kind = (rnd() < 0.55) ? 0 : Math.floor(1+rnd()*4);
      var pr = width*(0.05 + rnd()*0.22) * (kind===0 ? 0.7 : 1) * ((state.sparkSize||100)/100);
      var rot = rnd()*Math.PI*2;
      var col = cols[Math.floor(rnd()*cols.length)];
      var pa = a * (0.35 + rnd()*0.6);
      drawParticle(ctx, kind, px, py, pr, rot, col, pa);
    }
  });
  ctx.restore();

  // --- 4. 大きく光る粒（まばらに、加算合成で） ---
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  var big = Math.max(1, Math.floor(path.length/22));
  for (var b2=0;b2<big;b2++){
    var bp = path[Math.floor(rnd()*path.length)];
    var ba = rnd()*Math.PI*2, bo = rnd()*width*0.8;
    var bx = bp[0]+Math.cos(ba)*bo, by = bp[1]+Math.sin(ba)*bo;
    var bcol = cols[Math.floor(rnd()*cols.length)];
    var bl = width*(0.35+rnd()*0.55) * ((state.sparkSize||100)/100);
    // にじみ
    var g = ctx.createRadialGradient(bx,by,0,bx,by,bl*1.5);
    g.addColorStop(0, bcol); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = a*0.55;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx,by,bl*1.5,0,Math.PI*2); ctx.fill();
    // 芯のきらめき
    drawParticle(ctx, (rnd()<0.5?1:4), bx, by, bl, rnd()*Math.PI*2, "#FFFFFF", a*0.95);
  }
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";   // 必ず戻す
}

// 毎回同じ模様になるよう、種から乱数を作る
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= 背景 ================= */
// 背景の層をひとつ描く
function paintLayer(ctx, size, L) {
  ctx.save();
  ctx.globalAlpha = (L.alpha===undefined?100:L.alpha)/100;
  ctx.fillStyle = L.color;
  var n = Math.max(2, L.count || 16);       // いくつ並べるか
  var step = size / n;
  var th = (L.thick===undefined?50:L.thick)/100;   // 太さ・大きさの割合
  var off = ((L.offset||0)/100) * step;             // ずらす量
  var ang = (L.angle||0) * Math.PI/180;

  ctx.translate(size/2, size/2);
  ctx.rotate(ang);
  ctx.translate(-size/2, -size/2);

  var span = size*1.6, start = -size*0.3;
  if (L.type === "dot") {
    var rr = step*0.5*th;
    for (var y=-1;y<n+1;y++) for (var x=-1;x<n+1;x++) {
      var sx = (x+0.5)*step + off + (L.stagger && y%2 ? step/2 : 0);
      ctx.beginPath(); ctx.arc(sx, (y+0.5)*step, rr, 0, Math.PI*2); ctx.fill();
    }
  } else if (L.type === "stripe") {
    for (var i=-1;i<n+1;i++) ctx.fillRect(i*step+off, start, step*th, span);
  } else if (L.type === "border") {
    for (var j=-1;j<n+1;j++) ctx.fillRect(start, j*step+off, span, step*th);
  } else if (L.type === "check") {
    for (var cy2=-1;cy2<n+1;cy2++) for (var cx2=-1;cx2<n+1;cx2++)
      if ((cx2+cy2)%2===0) ctx.fillRect(cx2*step+off, cy2*step, step, step);
  } else if (L.type === "grid") {
    for (var g1=-1;g1<n+1;g1++) {
      ctx.fillRect(g1*step+off, start, step*th, span);
      ctx.fillRect(start, g1*step+off, span, step*th);
    }
  }
  ctx.restore();
}

function paintPattern(ctx, size) {
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, size, size);
  (state.layers||[]).forEach(function(L){ if(L.on!==false) paintLayer(ctx, size, L); });
}

/* ================= 中身 ================= */
function paintItems(ctx, size) {
  var cs = size / N;
  state.items.forEach(function (it) {
    if (it.t === "g") {
      if (it.photo) {
        var ph = findPhoto(it.photo);
        var im = ph && gemPhotoImage(ph);
        if (im && im.complete && !im._failed && im.naturalWidth) {
          var d2 = (it.r/100)*size*2;
          ctx.drawImage(im, it.x*size - d2/2, it.y*size - d2/2, d2, d2);
        } else {
          drawGem(ctx, "round", it.hue || "#FF6FAE", it.x*size, it.y*size, (it.r/100)*size, it.spark, it.rot, it.sd);
        }
      } else {
        drawGem(ctx, it.cut, it.hue, it.x*size, it.y*size, (it.r/100)*size, it.spark, it.rot, it.sd);
      }
    } else if (it.t === "s") {
      drawShape(ctx, it.shape, (it.gx+it.size/2)*cs, (it.gy+it.size/2)*cs, (cs*it.size)*0.46,
                it.color, it.outline, it.lineW);
    } else if (it.t === "gl" && it.pts.length) {
      drawGlitterStroke(ctx, it.pts, size, it.w, it.color, it.seed, (it.a===undefined?1:it.a/100));
    } else if (it.t === "b" && it.pts.length) {
      ctx.save();
      if (it.a !== undefined) ctx.globalAlpha = it.a/100;
      ctx.strokeStyle = it.color;
      ctx.lineWidth = Math.max(1,(it.w/100)*size);
      ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath();
      for (var i=0;i<it.pts.length;i++){var x=it.pts[i][0]*size,y=it.pts[i][1]*size; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      if (it.pts.length===1) ctx.lineTo(it.pts[0][0]*size+0.1, it.pts[0][1]*size);
      ctx.stroke();
      ctx.restore();
    } else if (it.t === "f" && it.png) {
      // 塗りつぶした領域（画像として保持）
      var im = getFillImage(it.png);
      if (im && im.complete) ctx.drawImage(im, 0, 0, size, size);
    } else if (it.t === "t") {
      var fs = size*0.072;
      ctx.font = "700 " + fs + "px 'MS Sans Serif', Tahoma, Verdana, sans-serif";
      ctx.textBaseline = "middle"; ctx.textAlign = "center";
      var m = ctx.measureText(it.text);
      var padX = fs*0.5, padY = fs*0.38;
      var w = m.width+padX*2, h = fs+padY*2;
      if (it.labelOn) {
        ctx.fillStyle = it.labelBg;
        ctx.fillRect(it.x*size-w/2, it.y*size-h/2, w, h);
        ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = Math.max(1,size/400);
        ctx.strokeRect(it.x*size-w/2, it.y*size-h/2, w, h);
      }
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, it.x*size, it.y*size);
      ctx.textAlign = "start";
    }
  });
}

function paintBoard() {
  var cv = document.getElementById("board");
  if (!cv) return;
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth;
  if (!w) return;
  cv.width = w*dpr; cv.height = w*dpr;
  var ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if (state.bgType === "none") {
    ctx.fillStyle="#FFF"; ctx.fillRect(0,0,w,w);
    ctx.fillStyle="#E8E8E8";
    var c0=w/16;
    for(var y=0;y<16;y++) for(var x=0;x<16;x++) if((x+y)%2===0) ctx.fillRect(x*c0,y*c0,c0,c0);
  } else if (state.bgType === "color") { ctx.fillStyle=state.bgColor; ctx.fillRect(0,0,w,w); }
  else paintPattern(ctx, w);

  if (state.mode === "stamp") {
    var cs=w/N;
    ctx.strokeStyle="rgba(0,0,0,0.10)"; ctx.lineWidth=1;
    for(var i=1;i<N;i++){
      ctx.beginPath();ctx.moveTo(i*cs,0);ctx.lineTo(i*cs,w);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*cs);ctx.lineTo(w,i*cs);ctx.stroke();
    }
  }
  paintItems(ctx, w);
}

function renderToCanvas() {
  var cv=document.createElement("canvas");
  cv.width=SIZE; cv.height=SIZE;
  var ctx=cv.getContext("2d");
  if (state.bgType==="color"){ctx.fillStyle=state.bgColor;ctx.fillRect(0,0,SIZE,SIZE);}
  else if (state.bgType==="pattern") paintPattern(ctx,SIZE);
  paintItems(ctx,SIZE);
  return cv;
}

/* ================= 操作 ================= */
function posOf(ev){
  var cv=document.getElementById("board");
  var r=cv.getBoundingClientRect();
  var t=ev.touches?ev.touches[0]:ev;
  return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height};
}
function pushHistory(){
  state.history.push(state.items.map(function(it){
    return it.t==="b" ? {t:"b",pts:it.pts.slice(),w:it.w,color:it.color} : it;
  }));
  if(state.history.length>60) state.history.shift();
}
function gemHue(){
  for(var i=0;i<GEMS.length;i++) if(GEMS[i].id===state.gem) return GEMS[i].hue;
  return GEMS[0].hue;
}
function newGem(x,y){
  return { t:"g", x:x, y:y, r:state.gemSize/2, cut:state.cut, hue:gemHue(),
           spark:state.spark, photo:state.gemPhoto,
           rot:Math.random()*Math.PI*2, sd:Math.floor(Math.random()*9999) };
}
// 直前の石から、直径×間隔ぶん進むごとに1粒ずつ置く（直線補間）
function placeGem(p){
  var pitch = (state.gemSize/100) * (state.gemGap/100);   // 0.8〜1.0倍が目安
  if (!state.lastGem) {
    state.items.push(newGem(p.x,p.y));
    state.lastGem = { x:p.x, y:p.y };
    paintBoard();
    return;
  }
  var lx = state.lastGem.x, ly = state.lastGem.y;
  var dist = Math.hypot(p.x-lx, p.y-ly);
  if (dist < pitch) return;
  var n = Math.floor(dist/pitch);
  for (var i=1;i<=n;i++){
    var t = (pitch*i)/dist;
    state.items.push(newGem(lx+(p.x-lx)*t, ly+(p.y-ly)*t));
  }
  var used = (pitch*n)/dist;
  state.lastGem = { x: lx+(p.x-lx)*used, y: ly+(p.y-ly)*used };
  paintBoard();
}
function placeStamp(p){
  var gx=Math.floor(p.x*N)-Math.floor((state.size-1)/2);
  var gy=Math.floor(p.y*N)-Math.floor((state.size-1)/2);
  gx=Math.max(0,Math.min(N-state.size,gx)); gy=Math.max(0,Math.min(N-state.size,gy));
  var last=state.items[state.items.length-1];
  if(last&&last.t==="s"&&last.gx===gx&&last.gy===gy&&last.size===state.size&&last.shape===state.shape&&last.color===state.color) return;
  state.items.push({t:"s",gx:gx,gy:gy,size:state.size,shape:state.shape,color:state.color,outline:state.outline,lineW:state.lineW});
  paintBoard();
}
function placeText(p){
  if(!state.text.trim())return;
  state.items.push({t:"t",x:p.x,y:p.y,text:state.text,color:state.textColor,labelOn:state.labelOn,labelBg:state.labelBg});
  paintBoard();
}
// 読み込んだ塗りつぶし画像の置き場
var fillCache = {};
function getFillImage(src) {
  if (!fillCache[src]) {
    var im = new Image();
    im.onload = function(){ paintBoard(); };
    im.src = src;
    fillCache[src] = im;
  }
  return fillCache[src];
}

// 触ったところから、線で囲まれた範囲だけを塗る
function floodFill(p) {
  var W = 420;                       // 判定に使う大きさ
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = W;
  var ctx = cv.getContext("2d");
  paintItems(ctx, W);                // いま描かれているものだけを写す

  var img = ctx.getImageData(0, 0, W, W);
  var d = img.data;
  var sx = Math.floor(p.x*W), sy = Math.floor(p.y*W);
  if (sx<0||sy<0||sx>=W||sy>=W) return;
  var si = (sy*W+sx)*4;
  var sr=d[si], sg=d[si+1], sb=d[si+2], sa=d[si+3];

  var out = ctx.createImageData(W, W);
  var od = out.data;
  var col = hexToRgb(state.color);
  var seen = new Uint8Array(W*W);
  var stack = [sy*W+sx];
  var tol = 42;

  function near(i) {
    var o=i*4;
    return Math.abs(d[o]-sr)<=tol && Math.abs(d[o+1]-sg)<=tol &&
           Math.abs(d[o+2]-sb)<=tol && Math.abs(d[o+3]-sa)<=tol;
  }
  var count = 0;
  while (stack.length) {
    var idx = stack.pop();
    if (seen[idx]) continue;
    if (!near(idx)) continue;
    seen[idx] = 1; count++;
    var o = idx*4;
    od[o]=col.r; od[o+1]=col.g; od[o+2]=col.b; od[o+3]=255;
    var x = idx % W, y = (idx - x) / W;
    if (x > 0)   stack.push(idx-1);
    if (x < W-1) stack.push(idx+1);
    if (y > 0)   stack.push(idx-W);
    if (y < W-1) stack.push(idx+W);
  }
  if (!count) return;
  ctx.putImageData(out, 0, 0);
  state.items.push({ t:"f", png: cv.toDataURL("image/png") });
  paintBoard();
}

function fillAll(){
  state.items.push({t:"f",color:state.color});
  paintBoard();
}
function eraseAt(p){
  for(var i=state.items.length-1;i>=0;i--){
    var it=state.items[i], hit=false;
    if(it.t==="g"){ hit = Math.hypot(it.x-p.x,it.y-p.y) < it.r/100 + 0.01; }
    else if(it.t==="s"){ hit = p.x>=it.gx/N&&p.x<=(it.gx+it.size)/N&&p.y>=it.gy/N&&p.y<=(it.gy+it.size)/N; }
    else if(it.t==="t"){ hit = Math.abs(p.x-it.x)<0.3&&Math.abs(p.y-it.y)<0.07; }
    else if(it.t==="f"){ hit = true; }
    else if(it.pts){ hit = it.pts.some(function(q){ return Math.hypot(q[0]-p.x,q[1]-p.y) < (it.w/100)*0.7+0.02; }); }
    if(hit){ state.items.splice(i,1); paintBoard(); return; }
  }
}
function onDown(ev){
  ev.preventDefault();
  var p=posOf(ev);
  pushHistory(); state.drawing=true;
  if(state.mode==="gem"){ state.lastGem=null; placeGem(p); }
  else if(state.mode==="stamp") placeStamp(p);
  else if(state.mode==="fill"){ floodFill(p); state.drawing=false; }
  else if(state.mode==="text"){ placeText(p); state.drawing=false; }
  else if(state.mode==="brush"||state.mode==="glitter"){
    state.cur={t:(state.mode==="glitter"?"gl":"b"),pts:[[p.x,p.y]],w:state.brushW,color:state.color,
               a:state.alpha, seed:Math.floor(Math.random()*100000)};
    state.items.push(state.cur); paintBoard();
  } else eraseAt(p);
}
function onMove(ev){
  if(!state.drawing)return;
  ev.preventDefault();
  var p=posOf(ev);
  if(state.mode==="gem") placeGem(p);
  else if(state.mode==="stamp") placeStamp(p);
  else if((state.mode==="brush"||state.mode==="glitter")&&state.cur){
    var last=state.cur.pts[state.cur.pts.length-1];
    if(Math.abs(last[0]-p.x)+Math.abs(last[1]-p.y)>0.004){ state.cur.pts.push([p.x,p.y]); paintBoard(); }
  } else if(state.mode==="erase") eraseAt(p);
}
function onUp(){ state.drawing=false; state.cur=null; state.lastGem=null; }

function toolIcon(mode, on) {

  if (mode==="stamp") return iconImg(function(c){ drawShape(c,"star",20,20,15,col); });
  if (mode==="brush") return iconImg(function(c){ c.strokeStyle=col;c.lineWidth=4;c.lineCap="round";
    c.beginPath();c.moveTo(8,30);c.quadraticCurveTo(20,4,32,26);c.stroke(); });
  if (mode==="glitter") return iconImg(function(c){
    c.strokeStyle="#C63BC0";c.lineWidth=6;c.lineCap="round";
    c.beginPath();c.moveTo(8,30);c.quadraticCurveTo(20,6,32,26);c.stroke();
    [[12,26],[19,14],[27,20],[24,28],[15,19]].forEach(function(p,i){

  });
  if (mode==="fill") return iconImg(function(c){ c.fillStyle=col;c.beginPath();
    c.moveTo(8,22);c.lineTo(20,8);c.lineTo(32,22);c.lineTo(20,34);c.closePath();c.fill(); });
  if (mode==="text") return iconImg(function(c){ c.fillStyle=col;c.font="700 26px sans-serif";
    c.textAlign="center";c.textBaseline="middle";c.fillText("A",20,21); });

    c.beginPath();c.moveTo(8,28);c.lineTo(20,10);c.lineTo(32,20);c.lineTo(20,32);c.closePath();c.fill();c.stroke(); });
}

                '<button class="btn" data-lstag="'+i+'" style="padding:2px 8px;font-size:11px'+(L.stagger?';border-color:#000 #FFF #FFF #000;background:#A8A8A8':'')+'">互い違い</button></div>') : "")
            ) : "") +
          '</div>';
        }).join("")) : "") +

      (saved.length ? (
        '<div class="lbl">STOCK（'+saved.length+'）</div>' +
        '<div class="row">' + saved.map(function(sv,i){
          return '<span style="position:relative;display:inline-block">' +
            '<img class="stockimg" src="'+sv+'" data-open="'+i+'">' +
            '<button data-del="'+i+'" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;'+
              'background:#C0C0C0;border:1px solid;border-color:#FFF #000 #000 #FFF;font-size:9px;line-height:14px">×</button></span>';
        }).join("") + '</div>' +
        '<div class="row" style="padding-top:6px">' +
          '<button class="btn" data-act="export">まとめて書き出し</button>' +
          '<button class="btn" data-act="sendIJ">index journal へ</button>' +
        '</div>'
      ) : "") +
    '</div>' +

    '<div class="marq"><span>★ MOTIF MAKER ★ ラインストーンとスタンプでモチーフをつくろう ★ できたら index journal に読みこめます ★</span></div>' +
    '<div class="status" id="note" style="margin:4px">For Help, click Help Topics on the Help Menu.</div>' +
  '</div>';

  var cv=document.getElementById("board");
  paintBoard();
  cv.addEventListener("touchstart",onDown,{passive:false});
  cv.addEventListener("touchmove",onMove,{passive:false});
  cv.addEventListener("touchend",onUp);
  cv.addEventListener("mousedown",onDown);
  cv.addEventListener("mousemove",onMove);
  cv.addEventListener("mouseup",onUp);
  cv.addEventListener("mouseleave",onUp);

  // メニューの開閉
  each(".mi",function(m){
    m.addEventListener("click",function(ev){
      if(ev.target.classList.contains("dd")) return;
      ev.stopPropagation();
      var wasOpen=m.classList.contains("open");
      each(".mi",function(x){x.classList.remove("open");});
      if(!wasOpen) m.classList.add("open");
    });
  });
  document.addEventListener("click",function(){ each(".mi",function(x){x.classList.remove("open");}); });

  each("[data-mode]",function(b){b.addEventListener("click",function(){state.mode=b.getAttribute("data-mode");render();});});
  each("[data-gem]",function(b){b.addEventListener("click",function(){state.gem=b.getAttribute("data-gem");state.gemPhoto=null;state.mode="gem";render();});});
  each("[data-cut]",function(b){b.addEventListener("click",function(){state.cut=b.getAttribute("data-cut");state.gemPhoto=null;state.mode="gem";render();});});
  each("[data-photo]",function(b){b.addEventListener("click",function(){state.gemPhoto=b.getAttribute("data-photo");state.mode="gem";render();});});
  each("[data-color]",function(b){b.addEventListener("click",function(){state.color=b.getAttribute("data-color");render();});});
  each("[data-shape]",function(b){b.addEventListener("click",function(){state.shape=b.getAttribute("data-shape");state.mode="stamp";render();});});
  each("[data-bg]",function(b){b.addEventListener("click",function(){state.bgType=b.getAttribute("data-bg");render();});});
  each("[data-addlayer]",function(b){b.addEventListener("click",function(){
    var tp=b.getAttribute("data-addlayer");
    state.layers.push({type:tp,color:state.color,count:16,thick:50,offset:0,angle:0,alpha:100,stagger:false,on:true});
    state.layerIdx=state.layers.length-1; state.bgType="pattern"; render();
  });});
  each("[data-lsel]",function(b){b.addEventListener("click",function(){state.layerIdx=Number(b.getAttribute("data-lsel"));render();});});
  each("[data-lon]",function(b){b.addEventListener("click",function(){
    var i=Number(b.getAttribute("data-lon")); state.layers[i].on = (state.layers[i].on===false); render();
  });});
  each("[data-lup]",function(b){b.addEventListener("click",function(){
    var i=Number(b.getAttribute("data-lup"));
    if(i<state.layers.length-1){ var t=state.layers[i]; state.layers[i]=state.layers[i+1]; state.layers[i+1]=t; state.layerIdx=i+1; }
    render();
  });});
  each("[data-ldel]",function(b){b.addEventListener("click",function(){
    var i=Number(b.getAttribute("data-ldel")); state.layers.splice(i,1);
    state.layerIdx=Math.max(0,state.layerIdx-1); render();
  });});
  each("[data-lstag]",function(b){b.addEventListener("click",function(){
    var i=Number(b.getAttribute("data-lstag")); state.layers[i].stagger=!state.layers[i].stagger; render();
  });});
  ["lcount","lthick","loffset","langle","lalpha"].forEach(function(key){
    each("[data-"+key+"]",function(inp){
      inp.addEventListener("input",function(e){
        var i=Number(inp.getAttribute("data-"+key));
        state.layers[i][key.slice(1)]=Number(e.target.value);
        paintBoard();
      });
      inp.addEventListener("change",function(){ render(); });
    });
  });
  each("[data-lcol]",function(inp){inp.addEventListener("input",function(e){
    state.layers[Number(inp.getAttribute("data-lcol"))].color=e.target.value; paintBoard();
  });});
  each("[data-label]",function(b){b.addEventListener("click",function(){state.labelOn=b.getAttribute("data-label")==="on";render();});});
  each("[data-outline]",function(b){b.addEventListener("click",function(){state.outline=b.getAttribute("data-outline")==="on";render();});});
  each("[data-spark]",function(b){b.addEventListener("click",function(){state.spark=Number(b.getAttribute("data-spark"));render();});});
  each("[data-act]",function(b){b.addEventListener("click",function(){ doAction(b.getAttribute("data-act")); });});

  bindRange("gemRange",function(v){state.gemSize=v;render();});
  bindRange("gapRange",function(v){state.gemGap=v;render();});
  bindRange("sizeRange",function(v){state.size=v;render();});
  bindRange("brushRange",function(v){state.brushW=v;render();});
  bindRange("brushRange2",function(v){state.brushW=v;render();});
  bindRange("lineRange",function(v){state.lineW=v;render();});
  bindRange("alphaRange",function(v){state.alpha=v;render();});
  bindRange("sparkSizeRange",function(v){state.sparkSize=v;paintBoard();});
  bindRange("sparkSizeRange2",function(v){state.sparkSize=v;render();});
  bindRange("sparkSizeRange3",function(v){state.sparkSize=v;render();});
  bindColor("freeColor",function(v){state.color=v;render();});
  bindColor("bgColorPick",function(v){state.bgColor=v;render();});
  bindColor("labelBgColor",function(v){state.labelBg=v;render();});
  bindColor("textColorPick",function(v){state.textColor=v;render();});
  var ti=document.getElementById("textInput");
  if(ti) ti.addEventListener("input",function(e){state.text=e.target.value;});

  each("[data-open]",function(im){im.addEventListener("click",function(){
    showImage(getSaved()[Number(im.getAttribute("data-open"))]);
  });});
  each("[data-del]",function(b){b.addEventListener("click",function(ev){
    ev.stopPropagation();
    var l=getSaved(); l.splice(Number(b.getAttribute("data-del")),1); setSaved(l); render();
  });});
}

function menu(id,label,inner){
  return '<div class="mi" id="'+id+'">'+label+'<div class="dropdown">'+inner+'</div></div>';
}

/* ---- 操作の実行 ---- */
function doAction(act){
  if(act==="newfile"){ pushHistory(); state.items=[]; paintBoard(); note("新しいモチーフ"); }
  else if(act==="undo"){ if(state.history.length){state.items=state.history.pop();paintBoard();note("元に戻しました");} }
  else if(act==="clear"){ pushHistory(); state.items=[]; paintBoard(); note("全部消しました"); }
  else if(act==="savepng"){ showImage(renderToCanvas().toDataURL("image/png"), true); }
  else if(act==="share"){ shareImage(); }
  else if(act==="stock"){
    var l=getSaved();
    if(l.length>=24){ note("ストックは24個までです"); return; }
    l.push(renderToCanvas().toDataURL("image/png"));
    if(!setSaved(l)){ note("保存できませんでした（容量不足）"); return; }
    render(); note("ストックに追加しました");
  }
  else if(act==="export"){ exportMotifs(); }
  else if(act==="sendIJ"){ sendToIndexJournal(); }
  else if(act==="palette"){ renderPalEditor(); }
  else if(act==="about"){ showAbout(); }
}

/* ---- 画像を大きく見せる（長押しで保存できる） ---- */
function showImage(dataUrl, isNew){
  if(!dataUrl) return;
  var d=document.createElement("div");
  d.className="modal";
  d.innerHTML='<div class="win modalWin">'+
    '<div class="title"><span>画像</span><span><span class="tb" id="mdClose">×</span></span></div>'+
    '<div class="modalBody">'+
      '<img src="'+dataUrl+'">'+
      '<p style="font-size:11px;line-height:1.8;padding-top:8px">'+
        '画像を<b>長押し</b>して「”写真”に保存」を選んでください。<br>'+
        'そのままインスタのストーリーに使えます。</p>'+
      '<div class="row" style="padding-top:8px">'+
        '<button class="btn" id="mdShare">共有…</button>'+
        '<button class="btn" id="mdDl">ダウンロード</button>'+
        '<button class="btn" id="mdOk">とじる</button></div>'+
    '</div></div>';
  document.body.appendChild(d);
  function close(){ d.remove(); }
  d.querySelector("#mdClose").addEventListener("click",close);
  d.querySelector("#mdOk").addEventListener("click",close);
  d.querySelector("#mdDl").addEventListener("click",function(){ downloadData(dataUrl,"motif-"+Date.now()+".png"); });
  d.querySelector("#mdShare").addEventListener("click",function(){ shareImage(dataUrl); });
  d.addEventListener("click",function(ev){ if(ev.target===d) close(); });
}

/* ---- 共有（端末の共有シート） ---- */
function shareImage(dataUrl){
  var url = dataUrl || renderToCanvas().toDataURL("image/png");
  try{
    var bin = atob(url.split(",")[1]);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var file = new File([arr], "motif.png", { type:"image/png" });
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file], title:"motif" }).catch(function(e){
        if(e&&e.name==="AbortError") return;
        showImage(url);
      });
      return;
    }
  }catch(e){}
  showImage(url);
}

/* ---- モチーフを書き出す ---- */
function exportMotifs(){
  var list=getSaved();
  if(!list.length){ note("ストックが空です"); return; }
  var payload=JSON.stringify({app:"index journal",type:"motifs",items:list});
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="index-journal-motifs.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
  note("ファイルに書き出しました");
}

/* ---- index journal へそのまま送る ---- */
function sendToIndexJournal(){
  var list=getSaved();
  if(!list.length){ note("ストックが空です"); return; }
  try{
    // 同じ端末なら、この置き場所を index journal が読みに来る
    localStorage.setItem("ij_motif_inbox", JSON.stringify({ items:list, at:Date.now() }));
  }catch(e){ note("受け渡しできませんでした（容量不足）"); return; }
  var d=document.createElement("div");
  d.className="modal";
  d.innerHTML='<div class="win modalWin">'+
    '<div class="title"><span>index journal へ</span><span><span class="tb" id="ijClose">×</span></span></div>'+
    '<div class="modalBody">'+
      '<p style="font-size:12px;line-height:1.9">ストックの '+list.length+' 個を受け渡しました。<br>'+
      'index journal を開いて、DESIGN →「↑ ファイルから読み込む」の下に出る<br>'+
      '<b>「MOTIF MAKER から受け取る」</b>を押してください。</p>'+
      '<div class="row" style="padding-top:10px">'+
        '<button class="btn" id="ijGo">index journal をひらく</button>'+
        '<button class="btn" id="ijOk">とじる</button></div>'+
    '</div></div>';
  document.body.appendChild(d);
  function close(){ d.remove(); }
  d.querySelector("#ijClose").addEventListener("click",close);
  d.querySelector("#ijOk").addEventListener("click",close);
  d.querySelector("#ijGo").addEventListener("click",function(){
    location.href="https://neomonkeyash-web.github.io/index-journal/";
  });
}

function bindRange(id,fn){var e=document.getElementById(id);if(e)e.addEventListener("input",function(ev){fn(Number(ev.target.value));});}
function bindColor(id,fn){var e=document.getElementById(id);if(e)e.addEventListener("input",function(ev){fn(ev.target.value);});}
function each(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f);}
function note(m){var e=document.getElementById("note");if(e)e.textContent=m;}
function downloadData(d,n){var a=document.createElement("a");a.href=d;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}

window.addEventListener("resize",paintBoard);
render();
